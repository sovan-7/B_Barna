  <script>
    // html_editor_enhanced renders each rich-text field as a same-origin
    // <iframe> running Summernote. Summernote's own bundled drop handler
    // loops every MIME type in the OS drag payload and pastes once per
    // type — a text drag usually carries both text/plain and text/html,
    // so it double-pastes, entirely inside the iframe's own document
    // before Flutter's DropRegion (in the host page) ever gets a look.
    //
    // Same-origin means we can reach into each iframe's own document
    // directly. Attaching a capture-phase 'drop' listener there runs
    // BEFORE Summernote's bubble-phase handler, so stopping propagation
    // there prevents Summernote's handler from running at all — then we
    // do the single plain-text insert ourselves. (An earlier attempt
    // disabled pointer-events on iframes from the outer document on
    // 'dragenter' instead, but that only works if the drag happens to
    // enter the page outside the iframe first — a race that fails
    // whenever the cursor lands directly on the iframe, which is most of
    // the time since the editor is the largest thing on screen.)
    function interceptDrop(doc) {
      doc.addEventListener('drop', function (event) {
        if (!event.dataTransfer) return;
        var text = event.dataTransfer.getData('text/plain');
        if (!text) return;
        event.preventDefault();
        event.stopPropagation();
        doc.execCommand('insertText', false, text);
      }, true);
    }

    function watchIframe(iframe) {
      if (iframe.__dropInterceptAttached) return;
      iframe.__dropInterceptAttached = true;
      if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
        interceptDrop(iframe.contentDocument);
      } else {
        iframe.addEventListener('load', function () {
          if (iframe.contentDocument) interceptDrop(iframe.contentDocument);
        });
      }
    }

    document.querySelectorAll('iframe').forEach(watchIframe);
    new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        mutation.addedNodes.forEach(function (node) {
          if (!node.querySelectorAll) return;
          if (node.tagName === 'IFRAME') watchIframe(node);
          node.querySelectorAll('iframe').forEach(watchIframe);
        });
      });
    }).observe(document.documentElement, {childList: true, subtree: true});
  </script>
